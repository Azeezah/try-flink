services:
  jobmanager:
    image: flink:1.18.1-scala_2.12
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      jobmanager.rpc.address: "jobmanager"

  taskmanager:
    image: flink:1.18.1-scala_2.12
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      jobmanager.rpc.address: "jobmanager"
      taskmanager.numberOfTaskSlots: "2"

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    ports:
      - "19092:19092"
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://kafka:9092,external://127.0.0.1:19092
